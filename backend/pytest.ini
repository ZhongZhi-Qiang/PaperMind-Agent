[pytest]
testpaths = tests
# pytest >= 9 collects with the `importlib` import mode, which breaks resolving
# site-packages submodules (e.g. `langchain.agents.middleware`) during collection.
# `prepend` restores the classic rootdir-on-sys.path behavior the suite relies on.
# Note: import-mode is a CLI flag in pytest 9 (no longer an ini key), so it goes via addopts.
addopts = --import-mode=prepend
